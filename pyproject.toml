[project]
name = "rulezet-editor"
version = "0.1.0"
description = "Server side of rulezet-editor: rule validation, rule lookup, tests (rulezet-tester); no database"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Theo Geffe" }]
dependencies = ["flask>=2.3"]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
test = ["rulezet-tester @ git+https://github.com/rulezet/rulezet-tester.git"]
dev = ["pytest>=7", "yara-python>=4.3"]

[project.scripts]
rulezet-editor = "rulezet_editor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]
include = ["rulezet_editor*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
